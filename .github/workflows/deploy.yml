name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ashoksaravanan222
        password: ${{ secrets.GHCR_PAT_LEARNLOOP }}
        
    # Build and push client image
    - name: Extract metadata for client Docker image
      id: meta-client
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/ashoksaravanan222/learnloop-client
        tags: |
          type=raw,value=latest
          type=sha,prefix={{branch}}-
        
    - name: Build and push client image
      uses: docker/build-push-action@v5
      with:
        context: ./client
        push: true
        tags: ${{ steps.meta-client.outputs.tags }}
        labels: ${{ steps.meta-client.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_SCHEMA=${{ secrets.NEXT_PUBLIC_SUPABASE_SCHEMA }}
          INTERNAL_API_BASE=http://server:8000

    # Build and push server image
    - name: Extract metadata for server Docker image
      id: meta-server
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/ashoksaravanan222/learnloop-server
        tags: |
          type=raw,value=latest
          type=sha,prefix={{branch}}-
        
    - name: Build and push server image
      uses: docker/build-push-action@v5
      with:
        context: ./server
        push: true
        tags: ${{ steps.meta-server.outputs.tags }}
        labels: ${{ steps.meta-server.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    runs-on: self-hosted
    needs: build
    
    steps:
    - name: Clean up certificate files before checkout
      run: |
        # Remove certificate files that might have permission issues
        sudo rm -rf certs/ || true
        sudo rm -f *.pem *.key || true
        
    - name: Checkout code
      uses: actions/checkout@v4
      
    # 1️⃣ Auth to the correct GHCR account
    - name: Log in to GHCR for deploy
      env:
        DOCKER_CONFIG: /home/srv/learnloop/.docker-ghcr
      run: |
        echo "${{ secrets.GHCR_PAT_LEARNLOOP }}" | \
          docker login ghcr.io -u ashoksaravanan222 --password-stdin

    # 2️⃣ Pull and restart
    - name: Deploy with newest images
      env:
        # Client environment variables
        SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        NEXT_PUBLIC_SUPABASE_SCHEMA: ${{ secrets.NEXT_PUBLIC_SUPABASE_SCHEMA }}
        
        # Server environment variables
        GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        
        # Database environment variables
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_NAME: ${{ secrets.DB_NAME }}
        
        # API and Socket.IO environment variables
        ORIGIN: ${{ secrets.ORIGIN }}
        
        # WebRTC environment variables
        TURN_URI: ${{ secrets.TURN_URI }}
        STUN_URI: ${{ secrets.STUN_URI }}
        TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
        TURN_PASSWORD: ${{ secrets.TURN_PASSWORD }}
        TURN_REALM: ${{ secrets.TURN_REALM }}
        TURN_PUBLIC_IP: ${{ secrets.TURN_PUBLIC_IP }}
        
        # Docker image references
        LEARNLOOP_CLIENT_IMAGE: ghcr.io/ashoksaravanan222/learnloop-client:latest
        LEARNLOOP_SERVER_IMAGE: ghcr.io/ashoksaravanan222/learnloop-server:latest
        
        # Server scaling
        SERVER_REPLICAS: ${{ secrets.SERVER_REPLICAS }}
        
      run: |
        docker compose pull
        docker compose up -d
        docker image prune -f