name: Deploy (Prod/Beta)

on:
  push:
    branches: [ main, beta ]
    paths:
      - 'client/**'
      - 'server/**'
      - 'model/**'
      - 'documents/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Channel is prod for main, beta for beta branch
  CHANNEL: ${{ github.ref_name == 'beta' && 'beta' || 'prod' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      client-changed: ${{ steps.changes.outputs.client }}
      server-changed: ${{ steps.changes.outputs.server }}
      model-changed: ${{ steps.changes.outputs.model }}
      documents-changed: ${{ steps.changes.outputs.documents }}
      any-changes: ${{ steps.changes.outputs.any }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Detect changes
        id: changes
        run: |
          # Compare full push range (handles multi-commit pushes)
          CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")

          set_flag () {
            if echo "$CHANGED_FILES" | grep -q "^$1/"; then
              echo "$2=true" >> $GITHUB_OUTPUT
            else
              echo "$2=false" >> $GITHUB_OUTPUT
            fi
          }

          set_flag "client" "client"
          set_flag "server" "server"
          set_flag "model"  "model"
          set_flag "documents" "documents"

          if echo "$CHANGED_FILES" | grep -qE "^client/|^server/|^model/|^documents/|^\.github/workflows/deploy\.yml"; then
            echo "any=true" >> $GITHUB_OUTPUT
          else
            echo "any=false" >> $GITHUB_OUTPUT
          fi

  build-client:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.client-changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta (client)
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ashokhomepc/learnloop-client
          tags: |
            type=raw,value=${{ env.CHANNEL == 'beta' && 'beta-latest' || 'latest' }}
            type=sha,prefix=${{ github.ref_name }}-

      - name: Build & push (client)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_CUSTOM_VOICE=${{ env.CHANNEL == 'beta' && 'true' || 'false' }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_SCHEMA=${{ secrets.NEXT_PUBLIC_SUPABASE_SCHEMA }}
            NEXT_PUBLIC_STATSIG_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_STATSIG_CLIENT_KEY }}
            INTERNAL_API_BASE=http://learnloop-server:8000

  build-server:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.server-changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ashokhomepc/learnloop-server
          tags: |
            type=raw,value=${{ env.CHANNEL == 'beta' && 'beta-latest' || 'latest' }}
            type=sha,prefix=${{ github.ref_name }}-

      - name: Build & push (server)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-model:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.model-changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta (model)
        id: meta-model
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ashokhomepc/learnloop-model
          tags: |
            type=raw,value=${{ env.CHANNEL == 'beta' && 'beta-latest' || 'latest' }}
            type=sha,prefix=${{ github.ref_name }}-

      - name: Build & push (model)
        uses: docker/build-push-action@v5
        with:
          context: ./model
          push: true
          tags: ${{ steps.meta-model.outputs.tags }}
          labels: ${{ steps.meta-model.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-documents:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.documents-changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with: { clean: true }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta (documents)
        id: meta-documents
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ashokhomepc/learnloop-documents
          tags: |
            type=raw,value=${{ env.CHANNEL == 'beta' && 'beta-latest' || 'latest' }}
            type=sha,prefix=${{ github.ref_name }}-

      - name: Build & push (documents)
        uses: docker/build-push-action@v5
        with:
          context: ./documents
          push: true
          tags: ${{ steps.meta-documents.outputs.tags }}
          labels: ${{ steps.meta-documents.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    runs-on: self-hosted
    needs: [detect-changes, build-client, build-server, build-model, build-documents]
    if: |
      always() &&
      (needs.detect-changes.outputs.any-changes == 'true' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: deploy-${{ github.ref_name == 'beta' && 'beta' || 'prod' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true

      - name: Prep filesystem
        run: |
          mkdir -p /srv/deploy/.docker-ghcr
          mkdir -p /srv/deploy/learnloop/prod /srv/deploy/learnloop/beta

      - name: Login GHCR
        env:
          DOCKER_CONFIG: /srv/deploy/.docker-ghcr
        run: |
          mkdir -p "$DOCKER_CONFIG"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Stage release to /srv/deploy/learnloop/{prod|beta}
        env:
          DEST: /srv/deploy/learnloop/${{ env.CHANNEL }}
        run: |
          mkdir -p "$DEST"

          # 0) Ensure these persistent dirs exist
          mkdir -p "$DEST/web/generated" "$DEST/prompts"
          
          # Match container users so entrypoints can seed/copy:
          chown -R 1001:1001 "$DEST/prompts"    || true   # server appuser

          # 1) Seed missing files ONLY (won't overwrite or delete)
          [ -d ./server/prompts ]     && rsync -a --ignore-existing ./server/prompts/         "$DEST/prompts"/     || true

          # 2) Write rsync filter: protect persistent/generated artifacts; exclude junk
          cat > .rsync-filter <<'EOF'
          # Exclude VCS and build caches
          - .git/
          - .github/
          - **/.DS_Store
          - **/node_modules/
          - **/.venv/
          - **/.pytest_cache/
          - **/__pycache__/

          # Exclude local env/secrets you might keep in repo working copies
          - **/.env.local
          - **/.envrc

          # Protect runtime/persistent dirs in DEST (do NOT delete)
          P web/generated/
          P prompts/
          EOF

          # 3) Mirror repo -> DEST (without touching protected dirs)
          rsync -a --delete --delete-excluded --filter="merge .rsync-filter" ./ "$DEST/"

          # 4) Make sure generated dir stays writable
          chmod 777 "$DEST/web/generated"

          # Sanity check: ensure nginx template is a file
          echo "== Nginx files check =="
          ls -ld "$DEST/web" "$DEST/web/default.conf.template" "$DEST/web/generated" || true
          if [ ! -f "$DEST/web/default.conf.template" ]; then
            echo "ERROR: web/default.conf.template is missing or not a file"
            echo "File type:"
            file "$DEST/web/default.conf.template" || true
            echo "Directory contents:"
            ls -la "$DEST/web/" || true
            exit 1
          fi

          # Optional traceability
          echo "${GITHUB_SHA}" > "$DEST/DEPLOYED_SHA"

      - name: Deploy
        working-directory: /srv/deploy/learnloop/${{ env.CHANNEL }}
        env:
          COMPOSE_PROJECT_NAME: learnloop-${{ env.CHANNEL }}
          DOCKER_CONFIG: /srv/deploy/.docker-ghcr

          # Image pins per channel
          LEARNLOOP_CLIENT_IMAGE: ghcr.io/ashokhomepc/learnloop-client:${{ env.CHANNEL == 'beta' && 'beta-latest' || 'latest' }}
          LEARNLOOP_SERVER_IMAGE: ghcr.io/ashokhomepc/learnloop-server:${{ env.CHANNEL == 'beta' && 'beta-latest' || 'latest' }}
          LEARNLOOP_MODEL_IMAGE:  ghcr.io/ashokhomepc/learnloop-model:${{ env.CHANNEL == 'beta' && 'beta-latest' || 'latest' }}
          LEARNLOOP_DOCUMENTS_IMAGE: ghcr.io/ashokhomepc/learnloop-documents:${{ env.CHANNEL == 'beta' && 'beta-latest' || 'latest' }}

          # Common env (client)
          SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_SCHEMA: ${{ secrets.NEXT_PUBLIC_SUPABASE_SCHEMA }}
          NEXT_PUBLIC_STATSIG_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_STATSIG_CLIENT_KEY }}

          # Common env (server)
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}


          # DB env
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

          # API/CORS
          ORIGIN: ${{ env.CHANNEL == 'beta' && secrets.BETA_ORIGIN || secrets.ORIGIN }}

          # Client port (parameterized) — defaults: prod 5007, beta 5012
          CLIENT_PORT: ${{ env.CHANNEL == 'beta' && secrets.BETA_CLIENT_PORT || secrets.CLIENT_PORT }}

          # WebRTC
          TURN_URI: ${{ env.CHANNEL == 'beta' && secrets.BETA_TURN_URI_PUBLIC || secrets.TURN_URI_PUBLIC }}
          STUN_URI: ${{ env.CHANNEL == 'beta' && secrets.BETA_STUN_URI_PUBLIC || secrets.STUN_URI_PUBLIC }}
          TURN_USERNAME: ${{ env.CHANNEL == 'beta' && secrets.BETA_TURN_USERNAME || secrets.TURN_USERNAME }}
          TURN_PASSWORD: ${{ env.CHANNEL == 'beta' && secrets.BETA_TURN_PASSWORD || secrets.TURN_PASSWORD }}
          TURN_REALM: ${{ secrets.TURN_REALM }}
          TURN_PUBLIC_IP: ${{ secrets.TURN_PUBLIC_IP }}

          # Scale
          SERVER_REPLICAS: ${{ env.CHANNEL == 'beta' && secrets.BETA_SERVER_REPLICAS || secrets.SERVER_REPLICAS }}
        run: |
          mkdir -p web/generated prompts templates files

          # Only web/generated must be writable by nginx/docker-gen
          chmod -R a+rwX web/generated || true

          # Do NOT chmod prompts/templates/files; they may be RO/immutable/foreign FS

          # Seed upstream files with fallback servers to prevent nginx crashes
          echo "server ${COMPOSE_PROJECT_NAME}-client:3000 max_fails=3 fail_timeout=30s;" > web/generated/next_client.upstream.conf
          echo "server ${COMPOSE_PROJECT_NAME}-server:8000 max_fails=3 fail_timeout=30s;" > web/generated/api_socketio.upstream.conf

          # Final sanity check before starting containers
          echo "== Pre-deployment nginx files check =="
          ls -ld web web/default.conf.template web/generated || true
          file web/default.conf.template || true
          
          # Ensure template file is not a directory (common Docker bind mount issue)
          if [ -d web/default.conf.template ]; then
            echo "ERROR: web/default.conf.template is a directory, not a file!"
            echo "This usually happens when Docker creates a directory for a missing bind mount."
            echo "Removing the directory and recreating from repo..."
            rm -rf web/default.conf.template
            # The file should be restored from git checkout
            if [ ! -f web/default.conf.template ]; then
              echo "ERROR: Still missing web/default.conf.template after cleanup"
              exit 1
            fi
          fi

          # Pull & up
          docker compose pull
          if [ "${{ env.CHANNEL }}" = "prod" ]; then
            docker compose --profile prod up -d --scale server="${SERVER_REPLICAS:-1}"
          else
            docker compose --profile beta up -d --scale server="${SERVER_REPLICAS:-1}"
          fi

          # Optional cleanup
          docker image prune -f
