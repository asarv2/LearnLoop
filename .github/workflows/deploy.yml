name: Deploy to Production

on:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      client-changed: ${{ steps.changes.outputs.client }}
      server-changed: ${{ steps.changes.outputs.server }}
      any-changes: ${{ steps.changes.outputs.any }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2  # Need at least 2 commits to compare
        
    - name: Detect changes
      id: changes
      run: |
        # Get the list of changed files
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        
        # Check if client folder has changes
        if echo "$CHANGED_FILES" | grep -q "^client/"; then
          echo "client=true" >> $GITHUB_OUTPUT
        else
          echo "client=false" >> $GITHUB_OUTPUT
        fi
        
        # Check if server folder has changes
        if echo "$CHANGED_FILES" | grep -q "^server/"; then
          echo "server=true" >> $GITHUB_OUTPUT
        else
          echo "server=false" >> $GITHUB_OUTPUT
        fi
        
        # Check if any relevant changes occurred
        if echo "$CHANGED_FILES" | grep -q "^client/\|^server/\|^\.github/workflows/deploy\.yml"; then
          echo "any=true" >> $GITHUB_OUTPUT
        else
          echo "any=false" >> $GITHUB_OUTPUT
        fi

  build-client:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.client-changed == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata for client Docker image
      id: meta-client
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/ashokhomepc/learnloop-client
        tags: |
          type=raw,value=latest
          type=sha,prefix={{branch}}-
        
    - name: Build and push client image
      uses: docker/build-push-action@v5
      with:
        context: ./client
        push: true
        tags: ${{ steps.meta-client.outputs.tags }}
        labels: ${{ steps.meta-client.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_SCHEMA=${{ secrets.NEXT_PUBLIC_SUPABASE_SCHEMA }}
          INTERNAL_API_BASE=http://learnloop-server:8000

  build-server:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.server-changed == 'true'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata for server Docker image
      id: meta-server
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/ashokhomepc/learnloop-server
        tags: |
          type=raw,value=latest
          type=sha,prefix={{branch}}-
        
    - name: Build and push server image
      uses: docker/build-push-action@v5
      with:
        context: ./server
        push: true
        tags: ${{ steps.meta-server.outputs.tags }}
        labels: ${{ steps.meta-server.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    runs-on: self-hosted
    needs: [detect-changes, build-client, build-server]
    if: |
      always() && 
      (needs.detect-changes.outputs.any-changes == 'true' || github.event_name == 'workflow_dispatch')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    # Login using the github.actor (whoever triggered the workflow)
    - name: Log in to GHCR for deploy
      env:
        DOCKER_CONFIG: /srv/deploy/.docker-ghcr
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io -u ${{ github.actor }} --password-stdin

    # Deploy to production
    - name: Deploy to production
      env:
        # Client environment variables
        SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        NEXT_PUBLIC_SUPABASE_SCHEMA: ${{ secrets.NEXT_PUBLIC_SUPABASE_SCHEMA }}
        
        # Server environment variables
        GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        
        # Database environment variables
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_NAME: ${{ secrets.DB_NAME }}
        
        # API and Socket.IO environment variables
        ORIGIN: ${{ secrets.ORIGIN }}
        
        # WebRTC environment variables
        TURN_URI_PUBLIC: ${{ secrets.TURN_URI_PUBLIC }}
        STUN_URI_PUBLIC: ${{ secrets.STUN_URI_PUBLIC }}
        TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
        TURN_PASSWORD: ${{ secrets.TURN_PASSWORD }}
        TURN_REALM: ${{ secrets.TURN_REALM }}
        TURN_PUBLIC_IP: ${{ secrets.TURN_PUBLIC_IP }}
        
        # Docker image references
        LEARNLOOP_CLIENT_IMAGE: ghcr.io/ashokhomepc/learnloop-client:latest
        LEARNLOOP_SERVER_IMAGE: ghcr.io/ashokhomepc/learnloop-server:latest
        
        # Server scaling
        SERVER_REPLICAS: ${{ secrets.SERVER_REPLICAS }}
        
        DOCKER_CONFIG: /srv/deploy/.docker-ghcr
      run: |

        mkdir -p web/generated
        chmod 777 web/generated

        docker compose pull
        docker compose up -d
        docker image prune -f