networks:
  internal:
    driver: bridge
    internal: true
  web:
    name: web
    external: true

services:
  # -----------------------------------------------------
  # CLIENT: Handles all traffic except for /socket.io
  # -----------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: ${LEARNLOOP_CLIENT_IMAGE:-ghcr.io/ashoksaravanan222/learnloop-client:latest}
    pull_policy: always
    container_name: learnloop-client
    restart: unless-stopped
    networks:
      - web
      - internal
    environment:
      - NODE_ENV=production
      - SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_SUPABASE_SCHEMA=${NEXT_PUBLIC_SUPABASE_SCHEMA}
      - INTERNAL_API_BASE=http://server:8000
      - HOSTNAME=0.0.0.0
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      server:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # --- HTTP to HTTPS Redirect ---
      - "traefik.http.routers.learnloop-http.rule=Host(`learn-loop.org`,`www.learn-loop.org`)"
      - "traefik.http.routers.learnloop-http.entrypoints=web"
      - "traefik.http.routers.learnloop-http.middlewares=https-redirect"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
      # --- Main App Router (naked domain) ---
      - "traefik.http.routers.learnloop-client.rule=Host(`learn-loop.org`)"
      - "traefik.http.routers.learnloop-client.entrypoints=websecure"
      - "traefik.http.routers.learnloop-client.tls.certresolver=letsencrypt"
      - "traefik.http.routers.learnloop-client.service=learnloop-client-svc"
      - "traefik.http.services.learnloop-client-svc.loadbalancer.server.port=3000"
      # --- WWW to non-WWW Redirect ---
      - "traefik.http.routers.learnloop-www.rule=Host(`www.learn-loop.org`)"
      - "traefik.http.routers.learnloop-www.entrypoints=websecure"
      - "traefik.http.routers.learnloop-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.learnloop-www.middlewares=drop-www"
      - "traefik.http.middlewares.drop-www.redirectregex.regex=^https?://www\\.learn-loop\\.org/(.*)"
      - "traefik.http.middlewares.drop-www.redirectregex.replacement=https://learn-loop.org/$${1}"
      # --- Static Assets Router (High Priority) ---
      - "traefik.http.routers.learnloop-client-static.rule=Host(`learn-loop.org`) && PathPrefix(`/_next`)"
      - "traefik.http.routers.learnloop-client-static.priority=11"
      - "traefik.http.routers.learnloop-client-static.entrypoints=websecure"
      - "traefik.http.routers.learnloop-client-static.tls.certresolver=letsencrypt"
      - "traefik.http.routers.learnloop-client-static.service=learnloop-client-svc"

  # -----------------------------------------------------
  # SERVER: Handles ONLY /socket.io traffic
  # -----------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ${LEARNLOOP_SERVER_IMAGE:-ghcr.io/ashoksaravanan222/learnloop-server:latest}
    pull_policy: always
    container_name: learnloop-server
    restart: unless-stopped
    networks:
      - internal
      - web
    environment:
      # ai
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # database
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}

      # api + socket.io
      - ORIGIN=${ORIGIN}
      - REDIS_URL=redis://redis:6379

      # webrtc
      - TURN_URI=${TURN_URI}
      - STUN_URI=${STUN_URI}
      - TURN_USERNAME=${TURN_USERNAME}
      - TURN_PASSWORD=${TURN_PASSWORD}
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: ${SERVER_REPLICAS:-1}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # This router has a HIGH PRIORITY and only matches the /socket.io path.
      - "traefik.http.routers.learnloop-socket.rule=Host(`learn-loop.org`) && PathPrefix(`/socket.io`)"
      - "traefik.http.routers.learnloop-socket.priority=20"
      - "traefik.http.routers.learnloop-socket.entrypoints=websecure"
      - "traefik.http.routers.learnloop-socket.tls.certresolver=letsencrypt"
      - "traefik.http.routers.learnloop-socket.service=learnloop-server-svc"
      - "traefik.http.services.learnloop-server-svc.loadbalancer.server.port=8000"
      # 🚀 THE FIX: Enable sticky sessions for this service.
      - "traefik.http.services.learnloop-server-svc.loadbalancer.sticky.cookie=true"

  redis:
    image: redis:7-alpine
    container_name: learnloop-redis
    restart: unless-stopped
    networks:
      - internal

  acme-extractor:
    image: ghcr.io/kereis/traefik-certs-dumper:latest
    container_name: learnloop-acme-extractor
    restart: "no"
    environment:
      - DOMAIN=turn.learn-loop.org          # dump only this cert
      - CERTIFICATE_FILE_NAME=fullchain         # → fullchain.pem
      - PRIVATE_KEY_FILE_NAME=privkey           # → privkey.pem
    volumes:
      - ../../../../../asaravan/Coding/api/acme.json:/traefik/acme.json:ro
      - ../../../certs:/output:rw

  webrtc:
    build: ./turn
    container_name: learnloop-webrtc
    restart: unless-stopped
    volumes:
      - ../../../certs:/etc/coturn/certs:ro
    environment:
      - TURN_REALM=${TURN_REALM}
      - TURN_USERNAME=${TURN_USERNAME}
      - TURN_PASSWORD=${TURN_PASSWORD}
      - TURN_PUBLIC_IP=${TURN_PUBLIC_IP}
    depends_on:
      - acme-extractor
    ports:
      - "3479:3479/udp"      # STUN/TURN over UDP (direct access)
      - "3479:3479/tcp"      # TURN over TCP (direct access)
      - "49553-49953:49553-49953/udp"  # UDP relay ports for media
    expose:
      - "5350"               # TLS port (routed through Traefik)
    networks: [web]                
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.turn.rule=HostSNI(`turn.learn-loop.org`)"
      - "traefik.tcp.routers.turn.entrypoints=websecure"
      - "traefik.tcp.routers.turn.tls.passthrough=true"
      - "traefik.tcp.services.turn.loadbalancer.server.port=5350"
