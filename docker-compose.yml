networks:
  internal:
    driver: bridge
    internal: true
  web:
    name: web
    external: true

services:
  client:
    image: ${LEARNLOOP_CLIENT_IMAGE:-ghcr.io/ashoksaravanan222/learnloop-client:latest}
    pull_policy: always
    container_name: learnloop-client
    restart: unless-stopped
    networks:
      - web
      - internal
    environment:
      - NODE_ENV=production
      - SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_SUPABASE_SCHEMA=${NEXT_PUBLIC_SUPABASE_SCHEMA}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      
      # --- 1️⃣  catch http (80) and push to https ---
      - traefik.http.routers.learnloop-http.rule=Host(`learn-loop.org`,`www.learn-loop.org`)
      - traefik.http.routers.learnloop-http.entrypoints=web
      - traefik.http.routers.learnloop-http.middlewares=https-redirect
      - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true
      
      # --- 2️⃣  naked-domain https router ---
      - traefik.http.routers.learnloop-client.rule=Host(`learn-loop.org`)
      - traefik.http.routers.learnloop-client.entrypoints=websecure
      - traefik.http.routers.learnloop-client.tls.certresolver=letsencrypt
      - traefik.http.routers.learnloop-client.service=learnloop-client
      - traefik.http.services.learnloop-client.loadbalancer.server.port=3000
      
      # --- 3️⃣  www ➜ non-www redirect on https ---
      - traefik.http.routers.learnloop-www.rule=Host(`www.learn-loop.org`)
      - traefik.http.routers.learnloop-www.entrypoints=websecure
      - traefik.http.routers.learnloop-www.tls.certresolver=letsencrypt
      - traefik.http.routers.learnloop-www.middlewares=drop-www
      - traefik.http.middlewares.drop-www.redirectregex.regex=^https?://www\\.learn-loop\\.org/(.*)
      - traefik.http.middlewares.drop-www.redirectregex.replacement=https://learn-loop.org/$${1}
      - traefik.http.middlewares.drop-www.redirectregex.permanent=true
      
      # Higher-priority router just for Next.js static assets
      - traefik.http.routers.learnloop-client-static.rule=Host(`learn-loop.org`) && PathPrefix(`/_next`)
      - traefik.http.routers.learnloop-client-static.priority=11
      - traefik.http.routers.learnloop-client-static.entrypoints=websecure
      - traefik.http.routers.learnloop-client-static.tls.certresolver=letsencrypt
      - traefik.http.routers.learnloop-client-static.service=learnloop-client
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://0.0.0.0:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  server:
    image: ${LEARNLOOP_SERVER_IMAGE:-ghcr.io/ashoksaravanan222/learnloop-server:latest}
    pull_policy: always
    container_name: learnloop-server
    restart: unless-stopped
    networks:
      - internal
      - web

    labels:
      - traefik.enable=true
      - traefik.docker.network=web
    healthcheck:
      test: ["CMD", "curl", "-s", "http://0.0.0.0:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: ${SERVER_REPLICAS:-1}


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal

  acme-extractor:
    image: ghcr.io/kereis/traefik-certs-dumper:latest
    container_name: webrtc-acme-extractor
    restart: "no"
    environment:
      - DOMAIN=turn.learn-loop.org          # dump only this cert
      - CERTIFICATE_FILE_NAME=fullchain         # → fullchain.pem
      - PRIVATE_KEY_FILE_NAME=privkey           # → privkey.pem
    volumes:
      - ../api/acme.json:/traefik/acme.json:ro      # single-file bind mount
      - ./certs:/output:rw                      # where the .pem/.key land

  webrtc:
    build: ./turn
    container_name: learnloop-webrtc
    restart: unless-stopped
    volumes:
      - ./certs:/etc/coturn/certs:ro
    env_file: .env
    depends_on:
      - acme-extractor
    ports:
      - "3478:3478/udp"      # STUN/TURN over UDP (direct access)
      - "3478:3478/tcp"      # TURN over TCP (direct access)
      - "49152-49552:49152-49552/udp"  # UDP relay ports for media
    expose:
      - "5349"               # TLS port (routed through Traefik)
    networks: [web]                
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.turn.rule=HostSNI(`turn.learn-loop.org`)"
      - "traefik.tcp.routers.turn.entrypoints=websecure"
      - "traefik.tcp.routers.turn.tls.passthrough=true"
      - "traefik.tcp.services.turn.loadbalancer.server.port=5349"

  nginx:
    image: nginx:1.25
    volumes:
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${CLIENT_PORT}:80"
    depends_on:
      - client
      - server
    networks:
      - internal
      - web
