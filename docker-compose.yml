networks:
  web:
    name: web
    external: true

services:
  client:
    image: ${LEARNLOOP_CLIENT_IMAGE:-ghcr.io/ashokhomepc/learnloop-client:latest}
    pull_policy: always
    restart: unless-stopped
    networks:
      web:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-client
    environment:
      - NODE_ENV=production
      - SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_SUPABASE_SCHEMA=${NEXT_PUBLIC_SUPABASE_SCHEMA}
      - STUN_URI=${STUN_URI}
      - TURN_URI=${TURN_URI}
      - TURN_USERNAME=${TURN_USERNAME}
      - TURN_PASSWORD=${TURN_PASSWORD}
      - INTERNAL_API_BASE=http://${COMPOSE_PROJECT_NAME}-server:8000
      - HOSTNAME=0.0.0.0
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://0.0.0.0:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      server:
        condition: service_healthy

  server:
    image: ${LEARNLOOP_SERVER_IMAGE:-ghcr.io/ashokhomepc/learnloop-server:latest}
    pull_policy: always
    restart: unless-stopped
    networks:
      web:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-server
    environment:
      # ai
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}

      # database
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}

      # api + socket.io
      - ORIGIN=${ORIGIN}
      - REDIS_URL=redis://${COMPOSE_PROJECT_NAME}-redis:6379
      - MODEL_SERVICE_URL=http://${COMPOSE_PROJECT_NAME}-model:8000
      - DOCUMENTS_SERVICE_URL=http://${COMPOSE_PROJECT_NAME}-documents:8000

      # webrtc
      - STUN_URI=stun:${COMPOSE_PROJECT_NAME}-webrtc-1:3479
      - TURN_URI=turn:${COMPOSE_PROJECT_NAME}-webrtc-1:3479?transport=udp
      - TURN_USERNAME=${TURN_USERNAME}
      - TURN_PASSWORD=${TURN_PASSWORD}
      - AUDIO_SECRET=${AUDIO_SECRET}

      # supabase storage
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}

    volumes:
      - ./server/prompts:/app/prompts
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  model:
    image: ${LEARNLOOP_MODEL_IMAGE:-ghcr.io/ashokhomepc/learnloop-model:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    networks:
      web:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-model
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - WHISPER_DEVICE=cuda
      # Add these for optimal performance
      - CUDA_DEVICE_MAX_CONNECTIONS=1
      - CUBLAS_WORKSPACE_CONFIG=:16:8
      - TOKENIZERS_PARALLELISM=false
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
    volumes:
      - ../model_cache:/app/model_cache
    deploy:
      resources:
        limits:
          memory: 24GB
        reservations:
          memory: 16GB
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["1"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  documents:
    image: ${LEARNLOOP_DOCUMENTS_IMAGE:-ghcr.io/ashokhomepc/learnloop-documents:latest}
    pull_policy: always
    restart: unless-stopped
    networks:
      web:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-documents
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      # Supabase Storage configuration
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
    volumes:
      - documents_files:/app/files                 # named volume for writable outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      web:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-redis

  acme-extractor:
    image: ghcr.io/kereis/traefik-certs-dumper:latest
    restart: "no"
    profiles:
      - prod
    environment:
      - DOMAIN=turn.learn-loop.org          # dump only this cert
      - CERTIFICATE_FILE_NAME=fullchain         # → fullchain.pem
      - PRIVATE_KEY_FILE_NAME=privkey           # → privkey.pem
    volumes:
      - ../../../api/acme.json:/traefik/acme.json:ro
      - ../../certs:/output:rw

  webrtc:
    build: ./turn
    restart: unless-stopped
    profiles:
      - prod
    volumes:
      - ../../certs:/etc/coturn/certs:ro
    environment:
      - TURN_REALM=${TURN_REALM}
      - TURN_USERNAME=${TURN_USERNAME}
      - TURN_PASSWORD=${TURN_PASSWORD}
      - TURN_PUBLIC_IP=${TURN_PUBLIC_IP}
    depends_on:
      - acme-extractor
    ports:
      - "3479:3479/udp"      # STUN/TURN over UDP (direct access)
      - "3479:3479/tcp"      # TURN over TCP (direct access)
      - "49553-49953:49553-49953/udp"  # UDP relay ports for media
      - "5350:5350/tcp"      # TLS port (routed through Traefik)
      - "5350:5350/udp"      # TLS port (routed through Traefik)
    networks: [web]                

  nginx:
    image: nginx:1.25
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT}:80"
    environment:
      - PROJECT_NAME=${COMPOSE_PROJECT_NAME}
    volumes:
      - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Share the generated upstream with nginx
      - ./web/generated:/etc/nginx/conf.d/generated:rw
    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  docker-gen-prod:
    image: jwilder/docker-gen:0.7.6
    restart: unless-stopped
    profiles: [prod]
    environment:
      - PROJECT_NAME=${COMPOSE_PROJECT_NAME}
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./web/generated:/etc/nginx/conf.d/generated:rw
      # mount the PROD templates
      - ./web/templates/api_socketio.upstream.prod.tmpl:/etc/docker-gen/templates/api_socketio.upstream.tmpl:ro
      - ./web/templates/next_client.upstream.prod.tmpl:/etc/docker-gen/templates/next_client.upstream.tmpl:ro
    command: >
      -notify-sighup ${COMPOSE_PROJECT_NAME}-nginx-1
      -watch
      /etc/docker-gen/templates/api_socketio.upstream.tmpl
      /etc/nginx/conf.d/generated/api_socketio.upstream.conf
      -watch
      /etc/docker-gen/templates/next_client.upstream.tmpl
      /etc/nginx/conf.d/generated/next_client.upstream.conf
    networks: [web]

  docker-gen-beta:
    image: jwilder/docker-gen:0.7.6
    restart: unless-stopped
    profiles: [beta]
    environment:
      - PROJECT_NAME=${COMPOSE_PROJECT_NAME}
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./web/generated:/etc/nginx/conf.d/generated:rw
      # mount the BETA templates
      - ./web/templates/api_socketio.upstream.beta.tmpl:/etc/docker-gen/templates/api_socketio.upstream.tmpl:ro
      - ./web/templates/next_client.upstream.beta.tmpl:/etc/docker-gen/templates/next_client.upstream.tmpl:ro
    command: >
      -notify-sighup ${COMPOSE_PROJECT_NAME}-nginx-1
      -watch
      /etc/docker-gen/templates/api_socketio.upstream.tmpl
      /etc/nginx/conf.d/generated/api_socketio.upstream.conf
      -watch
      /etc/docker-gen/templates/next_client.upstream.tmpl
      /etc/nginx/conf.d/generated/next_client.upstream.conf
    networks: [web]

volumes:
  documents_files: {}
