[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learnloop-model-service"
version = "0.1.0"
description = "LearnLoop Model Service - CTC Transcription and Audio Processing"
authors = [
    {name = "LearnLoop Team", email = "team@learnloop.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core web server
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn[standard]>=0.29.0,<0.30.0",
    "gunicorn>=22.0.0,<23.0.0",
    
    # Audio processing
    "numpy>=1.26.4,<2.0.0",
    "soundfile>=0.12.1,<1.0.0",
    "librosa>=0.10.1,<1.0.0",
    
    # ML models and processing
    "transformers>=4.40.0,<5.0.0",
    "ctc-segmentation>=1.7.0,<2.0.0",
    "faster-whisper>=1.0.0,<2.0.0",
    
    # Utilities
    "python-dotenv>=1.0.1,<1.1.0",
    "httpx>=0.27.0,<0.28.0",
    "orjson>=3.9.7,<4.0.0",
]

[project.optional-dependencies]
# Local development dependencies (CPU-only)
local = [
    "torch>=2.6.0,<2.7.0",
    "torchaudio>=2.6.0,<2.7.0",
]

# Production dependencies (GPU-enabled) - PyTorch already in base image
prod = [
    # PyTorch is already installed in the pytorch/pytorch base image
]

dev = [
    "pytest~=8.2.1",
    "pytest-asyncio~=0.23.7",
    "pytest-cov~=5.0.0",
    "pytest-mock~=3.14.0",
    # Ruff is now our primary linter, formatter, and import sorter
    "ruff~=0.4.5",
    "mypy~=1.17.0",
    "mypy-extensions~=1.0.0",
    "types-requests~=2.31.0",
    "types-PyYAML~=6.0.12",
    "pre-commit~=3.7.1",
    "ipython~=8.24.0",
    "ipdb~=0.13.13",
]

[project.scripts]
# Note: The 'main' function needs to be defined in app/main.py for this to work
learnloop-model-service = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (enforce type hints)
    "PT",  # flake8-pytest-style
]
ignore = [
    "E501",   # line too long, handled by ruff format
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "ANN101", # missing type annotation for self
]

# Configure Ruff to replace isort
[tool.ruff.lint.isort]
known-first-party = ["app"]

# Configure Ruff to replace Black
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
# Skip checking site-packages to avoid internal errors in third-party libraries
exclude = [
    ".*/site-packages/.*",
    ".*/lib/python.*/site-packages/.*",
]

# This is more precise than a global `ignore_missing_imports = true`
[[tool.mypy.overrides]]
module = [
    "gunicorn.*",
    "ctc_segmentation.*",
    "faster_whisper.*",
    "soundfile.*",
    "librosa.*",
    "transformers.*",
    "torch.*",
    "torchaudio.*",
    "torchvision.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# Be explicit about asyncio mode for pytest-asyncio >= 0.23
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
    "--tb=short",
    "-v",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]