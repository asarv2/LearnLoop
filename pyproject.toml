[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learnloop"
version = "0.1.0"
description = "LearnLoop - Unified Learning Platform"
authors = [
    {name = "LearnLoop Team", email = "team@learnloop.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # === SERVER DEPENDENCIES ===
    # Core web server
    "fastapi>=0.115.5,<0.116.0",
    "uvicorn[standard]>=0.29.0,<0.30.0",
    "gunicorn>=23.0.0,<24.0.0",
    "uvloop>=0.20.0,<0.21.0",

    # Key application logic
    "openai-agents[litellm,realtime]>=0.2.10,<0.3.0",
    "openai>=1.99.6,<2.0.0",

    # WebRTC and Media
    "aiortc>=1.7.0,<1.8.0",
    "av>=11.0,<12.0",
    "numpy>=1.26.4,<1.27.0",
    
    # WebSocket Signaling
    "python-socketio[asyncio_client]>=5.11.2,<5.12.0",

    # Database
    "sqlmodel>=0.0.18,<0.1.0",
    "sqlalchemy>=2.0.30,<2.1.0",
    "psycopg[binary]>=3.1.18,<3.2.0",
    "sqlacodegen>=3.0.0rc4,<3.1.0",

    # Utilities
    "python-dotenv>=1.0.1,<1.1.0",
    "httpx>=0.27.0,<0.28.0",
    "redis[hiredis]>=5.0.0,<5.1.0",
    "backoff>=2.2.1,<3.0.0",
    "litellm>=1.4,<2.0",
    "orjson>=3.9.7,<4.0.0",

    # === MODEL DEPENDENCIES ===
    # Data processing
    "soundfile>=0.12.1,<1.0.0",
    "librosa>=0.10.1,<1.0.0",

    # ML stack
    "transformers>=4.51.0",
    "peft>=0.15.2",
    "accelerate>=1.8.0",
    "ctc-segmentation>=1.7.0,<2.0.0",
    "faster-whisper>=1.0.0,<2.0.0",

    # === DOCUMENTS DEPENDENCIES ===
    # (Ready for future document processing dependencies)

    # === DEVELOPMENT DEPENDENCIES ===
    # Testing
    "pytest~=8.2.1",
    "pytest-asyncio~=0.23.7",
    "pytest-cov~=5.0.0",
    "pytest-mock~=3.14.0",
    
    # Code quality
    "ruff~=0.4.5",
    "mypy~=1.10.0",
    "mypy-extensions~=1.0.0",
    "types-requests~=2.31.0",
    "types-PyYAML~=6.0.12",
    "pre-commit~=3.7.1",
    
    # Development tools
    "ipython~=8.24.0",
    "ipdb~=0.13.13",
]

[project.scripts]
# Note: The 'main' function needs to be defined in app/main.py for this to work
learnloop-server = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (enforce type hints)
    "PT",  # flake8-pytest-style
]
ignore = [
    "E501",   # line too long, handled by ruff format
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "ANN101", # missing type annotation for self
]

# Configure Ruff to replace isort
[tool.ruff.lint.isort]
known-first-party = ["app"]

# Configure Ruff to replace Black
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

# This is more precise than a global `ignore_missing_imports = true`
[[tool.mypy.overrides]]
module = [
    "aiortc.*",
    "av.*",
    "socketio.*",
    "sqlacodegen.*",
    "gunicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# Be explicit about asyncio mode for pytest-asyncio >= 0.23
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
    "--tb=short",
    "-v",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]