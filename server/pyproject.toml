[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learnloop-server"
version = "0.1.0"
description = "LearnLoop API Server"
authors = [
    {name = "LearnLoop Team", email = "team@learnloop.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Use ~= for stable, compatible releases
    "fastapi~=0.111.0",
    "uvicorn[standard]~=0.29.0",
    "gunicorn~=22.0.0",
    "openai-agents[litellm]~=0.2.0",
    "aiortc~=1.7.0",
    "av~=11.0",
    "websockets~=12.0",
    "supabase~=2.4.0",
    "python-dotenv~=1.0.1",
    "httpx~=0.27.0",
    "sqlmodel~=0.0.18",
    "sqlalchemy~=2.0.30",
    "psycopg[binary]~=3.1.18",
    "sqlacodegen~=3.0.0rc4",
    "python-socketio[asyncio_client]~=5.11.2",
    "redis~=5.2.0",
    "numpy~=1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.2.1",
    "pytest-asyncio~=0.23.7",
    "pytest-cov~=5.0.0",
    "pytest-mock~=3.14.0",
    # Ruff is now our primary linter, formatter, and import sorter
    "ruff~=0.4.5",
    "mypy~=1.10.0",
    "mypy-extensions~=1.0.0",
    "types-requests~=2.31.0",
    "types-PyYAML~=6.0.12",
    # REMOVED: black and isort are no longer needed
    "pre-commit~=3.7.1",
    "ipython~=8.24.0",
    "ipdb~=0.13.13",
]

[project.scripts]
# Note: The 'main' function needs to be defined in app/main.py for this to work
learnloop-server = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (enforce type hints)
    "PT",  # flake8-pytest-style
]
ignore = [
    "E501",   # line too long, handled by ruff format
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "ANN101", # missing type annotation for self
]

# Configure Ruff to replace isort
[tool.ruff.lint.isort]
known-first-party = ["app"]

# Configure Ruff to replace Black
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

# This is more precise than a global `ignore_missing_imports = true`
[[tool.mypy.overrides]]
module = [
    "aiortc.*",
    "av.*",
    "socketio.*",
    "sqlacodegen.*",
    "gunicorn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# Be explicit about asyncio mode for pytest-asyncio >= 0.23
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
    "--tb=short",
    "-v",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]